server.port=8081
spring.application.name=utility-software

spring.datasource.url=jdbc:mysql://localhost:3306/utility_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Vishal@931833

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# React dev server origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Sample meters (demo data). Keep false to show only real data from the database.
app.seed-sample-data=false

# ---------------- MQTT (device / simulator) ----------------
# false = requests are answered from the database only
# true  = requests are published to the device over MQTT and its reply is returned
mqtt.enabled=false
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=utility-software-backend
mqtt.username=
mqtt.password=
# Topic on which the device listens for requests
mqtt.request-topic=device/naineet/req
# The topic the device answers on is the "Message ID" typed in the Request Builder
mqtt.qos=1
mqtt.response-timeout-ms=5000
